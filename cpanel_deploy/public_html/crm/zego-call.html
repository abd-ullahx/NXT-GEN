<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>HD Virtual Survey Video Call · Zego Cloud</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #video-root {
      width: 100%; height: 100%;
      background: #050608;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #video-root { display: flex; align-items: center; justify-content: center; }
    .loader { color: #d4af37; text-align: center; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(212,175,55,0.2);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    .loader p { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .loader small { font-size: 11px; color: #888; font-family: monospace; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="video-root">
    <div class="loader">
      <div class="spinner"></div>
      <p>Connecting to Zego Cloud Room...</p>
      <small id="room-label">Loading...</small>
    </div>
  </div>

  <!-- Official ZegoCloud UIKit Prebuilt Web SDK -->
  <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>

  <script>
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name) || '';
    }

    var APP_ID         = getParam('appID') ? Number(getParam('appID')) : 949748271;
    var SERVER_SECRET  = getParam('serverSecret') || '0b401e81a085bb92c949551ee96fb628';
    var roomID   = String(getParam('roomID') || ('ROOM-LIVE-' + Date.now())).trim();
    var userID   = String(getParam('userID') || ('admin_' + Date.now())).trim();
    var userName = String(getParam('userName') || 'Admin Office').trim();
    var isVideo  = getParam('isVideo') !== 'false';

    var roomLabel = document.getElementById('room-label');
    if (roomLabel) roomLabel.textContent = roomID + ' (App ID: ' + APP_ID + ')';

    function initZego() {
      console.log('[ZegoWeb] Joining Zego Room:', roomID, 'with AppID:', APP_ID, 'as User:', userID);

      try {
        if (typeof ZegoUIKitPrebuilt === 'undefined') {
          console.error('[ZegoWeb] ZegoUIKitPrebuilt script failed to load from CDN');
          return;
        }

        var kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(
          APP_ID, SERVER_SECRET, roomID, userID, userName
        );

        var zp = ZegoUIKitPrebuilt.create(kitToken);
        var container = document.getElementById('video-root');
        container.innerHTML = '';

        zp.joinRoom({
          container: container,
          scenario: { mode: ZegoUIKitPrebuilt.OneONoneCall },
          showPreJoinView: false,
          turnOnMicrophoneWhenJoining: true,
          turnOnCameraWhenJoining: isVideo,
          showMyCameraToggleButton: true,
          showMyMicrophoneToggleButton: true,
          showAudioVideoSettingsButton: false,
          showScreenSharingButton: false,
          showTextChat: false,
          showUserList: false,
          maxUsers: 2,
          layout: 'Auto',
          onJoinRoom: function() {
            console.log('[ZegoWeb] Successfully joined Zego Room:', roomID);
          },
          onLeaveRoom: function() {
            window.parent.postMessage({ type: 'zego_leave', roomID: roomID }, '*');
          }
        });

      } catch(e) {
        console.error('[ZegoWeb] Initialization error:', e);
      }
    }

    if (document.readyState === 'complete') {
      initZego();
    } else {
      window.addEventListener('load', initZego);
    }
  </script>
</body>
</html>
